<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>歷史記憶練習</title>
  <link rel="stylesheet" href="styles.css?v=025">
</head>
<body>
  <div id="app"><div class="shell"><div class="card" style="margin-top:20vh;text-align:center"><b>正在清理舊版本…</b></div></div></div>
  <script>
  (async()=>{
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch(e) {
      console.warn('cleanup', e);
    }
    location.replace('./clean.html?v=025');
  })();
  </script>
</body>
</html>
